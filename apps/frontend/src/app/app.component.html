<div class="relative min-h-screen bg-freq-ink">
  <div class="pointer-events-none absolute inset-0 opacity-50" aria-hidden="true">
    <div class="h-full w-full bg-freq-noise"></div>
  </div>

  <div class="relative flex min-h-screen flex-col">
    <header class="border-b border-white/10 bg-freq-midnight/60 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-6">
        <a routerLink="/" (click)="onHomeClick()" class="text-lg font-semibold tracking-tight text-freq-cream transition hover:text-white">
          {{ title }}
        </a>
        <nav class="flex items-center gap-3 text-sm font-medium">
          <a routerLink="/" (click)="onHomeClick()" class="rounded-full border border-white/10 px-3 py-1 text-freq-cream transition hover:border-white/30 hover:bg-white/10">
            Home
          </a>
          <a routerLink="/discover" class="rounded-full border border-white/10 px-3 py-1 text-freq-cream transition hover:border-white/30 hover:bg-white/10">
            Discover
          </a>
          <a routerLink="/collections/adam" class="rounded-full border border-white/10 px-3 py-1 text-freq-cream transition hover:border-white/30 hover:bg-white/10">
            My Collection
          </a>
        </nav>
      </div>
    </header>

    @if ((apiStatus.status$ | async) === 'waking') {
      <div class="flex items-center justify-center gap-2 border-b border-freq-rose/40 bg-freq-rose/20 px-6 py-3 text-sm font-medium text-freq-rose backdrop-blur">
        <span class="inline-block h-2 w-2 animate-pulse rounded-full bg-freq-rose"></span>
        Just a moment — pulling the first record off the shelf.
      </div>
    }

    <main class="flex-1">
      <router-outlet />
    </main>

    <footer class="border-t border-white/5 bg-freq-midnight/60 backdrop-blur">
      <div class="mx-auto flex w-full max-w-6xl flex-col gap-2 px-6 py-8 text-xs text-freq-cream/60 md:flex-row md:items-center md:justify-between">
        <span>FreqShow - for those who still read liner notes.</span>
        <span>Music data via MusicBrainz, Wikipedia, and Discogs.</span>
      </div>
    </footer>
  </div>
</div>
