openapi: 3.0.3
info:
  title: FreqShow API
  version: 0.1.0
  description: |
    FreqShow backend API.

    This spec is intended to become the source of truth for backend responses
    and generated frontend types.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Search
  - name: Artists
  - name: Albums

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /search:
    get:
      tags: [Search]
      summary: Search artists (MusicBrainz)
      operationId: searchArtists
      parameters:
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of results to return.

            Implementation defaults to 25 and clamps to 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          description: |
            Result offset for pagination.

            Implementation defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Missing/invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingQuery:
                  value:
                    error: "search query parameter 'q' is required"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          description: Search failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                failed:
                  value:
                    error: search failed

  /artists/{id}:
    get:
      tags: [Artists]
      summary: Get artist by MusicBrainz ID (cache-first)
      operationId: getArtist
      parameters:
        - $ref: '#/components/parameters/ArtistId'
      responses:
        '200':
          description: Artist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: artist not found
        '502':
          description: Upstream error (MusicBrainz)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badGateway:
                  value:
                    error: musicbrainz lookup failed
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unavailable:
                  value:
                    error: musicbrainz client unavailable
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /albums/{id}:
    get:
      tags: [Albums]
      summary: Get album (release group) by MusicBrainz ID (cache-first)
      operationId: getAlbum
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      responses:
        '200':
          description: Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Album not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: album not found
        '502':
          description: Upstream error (MusicBrainz)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badGateway:
                  value:
                    error: musicbrainz lookup failed
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unavailable:
                  value:
                    error: musicbrainz client unavailable
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  parameters:
    ArtistId:
      name: id
      in: path
      required: true
      description: MusicBrainz artist MBID
      schema:
        type: string
        minLength: 1
    AlbumId:
      name: id
      in: path
      required: true
      description: MusicBrainz release-group MBID
      schema:
        type: string
        minLength: 1

  responses:
    MethodNotAllowed:
      description: Method not allowed

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    SearchResult:
      type: object
      description: MusicBrainz artist search results
      # NOTE: This schema mirrors the backend response type in musicbrainz.SearchResult.
      additionalProperties: false
      required: [artists, offset, count]
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/SearchArtist'
        offset:
          type: integer
          minimum: 0
        count:
          type: integer
          minimum: 0

    SearchArtist:
      type: object
      additionalProperties: false
      required: [id, name, lifeSpan]
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        disambiguation:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
          nullable: true
        lifeSpan:
          $ref: '#/components/schemas/LifeSpan'

    Artist:
      type: object
      additionalProperties: false
      required: [id, name, biography, genres, albums, related, imageUrl, lifeSpan]
      properties:
        id:
          type: string
        name:
          type: string
        biography:
          type: string
        genres:
          type: array
          items:
            type: string
          nullable: true
        albums:
          type: array
          items:
            $ref: '#/components/schemas/Album'
          nullable: true
        related:
          type: array
          items:
            type: string
          nullable: true
        imageUrl:
          type: string
        country:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        disambiguation:
          type: string
          nullable: true
        aliases:
          type: array
          items:
            type: string
          nullable: true
        lifeSpan:
          $ref: '#/components/schemas/LifeSpan'

    LifeSpan:
      type: object
      additionalProperties: false
      required: []
      properties:
        begin:
          type: string
          nullable: true
        end:
          type: string
          nullable: true
        ended:
          type: boolean
          nullable: true

    Album:
      type: object
      additionalProperties: false
      required: [id, title, artistId, year, genre, label, tracks, review, coverUrl]
      properties:
        id:
          type: string
        title:
          type: string
        artistId:
          type: string
        artistName:
          type: string
          nullable: true
        primaryType:
          type: string
          nullable: true
        secondaryTypes:
          type: array
          items:
            type: string
          nullable: true
        firstReleaseDate:
          type: string
          nullable: true
        year:
          type: integer
          description: Release year extracted from firstReleaseDate when available
        genre:
          type: string
        label:
          type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
          nullable: true
        review:
          $ref: '#/components/schemas/Review'
        coverUrl:
          type: string

    Track:
      type: object
      additionalProperties: false
      required: [number, title, length]
      properties:
        number:
          type: integer
          minimum: 0
        title:
          type: string
        length:
          type: string
          description: Track duration formatted as MM:SS

    Review:
      type: object
      additionalProperties: false
      required: [source, author, rating, summary, text, url]
      properties:
        source:
          type: string
        author:
          type: string
        rating:
          type: number
          format: double
        summary:
          type: string
        text:
          type: string
        url:
          type: string
